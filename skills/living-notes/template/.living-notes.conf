# Living Notes configuration (shell syntax, read by tools/notes-commit and tools/mirror-push)

# Folder holding the notes (relative to the repository root). Used by the lint and the map builder.
NOTES_DIR=notes

# Line added to commits made by an AI agent (omit with: notes-commit --human). Leave empty for none.
AGENT_TRAILER=""
# Example: AGENT_TRAILER="Co-Authored-By: Your Agent <noreply@example.com>"

# Files whose live copy must equal the committed copy. When any file matching these globs is part of a commit,
# SYNC_CMD runs after the commit (for example a script that copies them to the server that runs them).
SYNC_GLOBS=""
SYNC_CMD=""
# Example: SYNC_GLOBS="notes/scripts/health.sh notes/scripts/report.sh"  SYNC_CMD="tools/sync-scripts.sh"

# Syntax checks run before a commit on changed files with these extensions (bash -n for sh, python -m py_compile for py).
CHECK_SH=1
CHECK_PY=1

# mirror-push: where to mirror this repository. Empty = not configured. Forms: a local directory (/path or C:\path),
# git:URL (git push --mirror to any git remote or bare repository; no rsync needed), or user@host:/path (needs ssh and rsync).
MIRROR_TARGET=""
# Commands to run after a successful mirror (for example rebuild/publish the notes map). One per line, run with bash
# (on Windows with cmd.exe).
POST_PUSH_CMDS=""

# Extra regular expressions (ERE, one per line in the file named here) that the secret scan should NOT flag.
SECRET_ALLOW_FILE=.living-notes-secret-allow
