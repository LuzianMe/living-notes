# Checks every change to the notes: secret scan of the added lines + notes-lint (tools/ci-check).
# Make it a required status check in the branch protection of main (see docs/TEAM.md).
# GitHub Enterprise Server: use a runner label your instance has, and make sure actions/checkout is available to it.
name: notes-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan and lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/ci-check "$BASE_SHA"
