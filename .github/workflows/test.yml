name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Git identity for the test commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Smoke test
        run: bash tests/smoke.sh
