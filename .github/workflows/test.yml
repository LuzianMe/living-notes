name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity for the test commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Native test (no bash; real launchers; Linux, macOS and Windows)
        run: python tests/native.py
      - name: Smoke test (bash)
        if: runner.os != 'Windows'
        run: bash tests/smoke.sh
